apiVersion: apps/v1
kind: Deployment
metadata:
  name: event-manager
  namespace: event-manager
  labels:
    app: event-manager
    version: v1.0.0
spec:
  replicas: 3
  selector:
    matchLabels:
      app: event-manager
  template:
    metadata:
      labels:
        app: event-manager
        version: v1.0.0
    spec:
      containers:
      - name: event-manager
        image: ghcr.io/chikku1780/event_manager_task:latest
        ports:
        - containerPort: 3000
          name: frontend
        - containerPort: 4000
          name: backend
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "4000"
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: event-manager-secrets
              key: jwt-secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /graphql
            port: 4000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        volumeMounts:
        - name: config-volume
          mountPath: /app/backend/.env
          subPath: backend.env
        - name: config-volume
          mountPath: /app/frontend/.env
          subPath: frontend.env
      volumes:
      - name: config-volume
        configMap:
          name: event-manager-config
      imagePullSecrets:
      - name: ghcr-secret
---
apiVersion: v1
kind: Service
metadata:
  name: event-manager-service
  namespace: event-manager
spec:
  selector:
    app: event-manager
  ports:
  - name: frontend
    port: 80
    targetPort: 3000
  - name: backend
    port: 4000
    targetPort: 4000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: event-manager-hpa
  namespace: event-manager
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: event-manager
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: event-manager-ingress
  namespace: event-manager
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - eventmanager.com
    - www.eventmanager.com
    secretName: event-manager-tls
  rules:
  - host: eventmanager.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: event-manager-service
            port:
              number: 80
  - host: www.eventmanager.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: event-manager-service
            port:
              number: 80
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: event-manager-config
  namespace: event-manager
data:
  backend.env: |
    NODE_ENV=production
    PORT=4000
    JWT_SECRET=your-jwt-secret-here
  frontend.env: |
    NEXT_PUBLIC_GRAPHQL_URL=http://event-manager-service:4000/graphql
---
apiVersion: v1
kind: Secret
metadata:
  name: event-manager-secrets
  namespace: event-manager
type: Opaque
data:
  jwt-secret: eW91ci1qd3Qtc2VjcmV0LWhlcmU= # base64 encoded
---
apiVersion: v1
kind: Namespace
metadata:
  name: event-manager 