version: '3.8'

services:
  event-manager:
    image: ghcr.io/chikku1780/event_manager_task:latest
    container_name: event-manager-production
    ports:
      - "3000:3000" # Frontend
      - "4000:4000" # Backend
    environment:
      - NODE_ENV=production
      - PORT=4000
    volumes:
      - ./backend/env.prod:/app/backend/.env:ro
      - ./frontend/env.prod:/app/frontend/.env:ro
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - event-manager-production-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.event-manager-prod.rule=Host(`eventmanager.com`)"
      - "traefik.http.routers.event-manager-prod.tls=true"
      - "traefik.http.routers.event-manager-prod.tls.certresolver=letsencrypt"
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

  # Load balancer
  nginx:
    image: nginx:alpine
    container_name: nginx-production
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - event-manager
    networks:
      - event-manager-production-network
    restart: unless-stopped

  # Monitoring stack
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-production
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - event-manager-production-network
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana-production
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    networks:
      - event-manager-production-network
    restart: unless-stopped

  # Logging
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: elasticsearch-production
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - event-manager-production-network
    restart: unless-stopped

  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: kibana-production
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    volumes:
      - ./monitoring/kibana/kibana.yml:/usr/share/kibana/config/kibana.yml:ro
    networks:
      - event-manager-production-network
    depends_on:
      - elasticsearch
    restart: unless-stopped

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.11.0
    container_name: filebeat-production
    user: root
    volumes:
      - ./monitoring/filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - event-manager-production-network
    depends_on:
      - elasticsearch
    restart: unless-stopped

  # Backup service
  backup:
    image: alpine:latest
    container_name: backup-production
    volumes:
      - ./backup:/backup
      - prometheus_data:/data/prometheus:ro
      - grafana_data:/data/grafana:ro
      - elasticsearch_data:/data/elasticsearch:ro
    command: |
      sh -c "
        apk add --no-cache tar gzip
        while true; do
          echo 'Creating backup...'
          tar -czf /backup/backup-$(date +%Y%m%d-%H%M%S).tar.gz /data
          sleep 86400
        done
      "
    networks:
      - event-manager-production-network
    restart: unless-stopped

networks:
  event-manager-production-network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
  elasticsearch_data:
